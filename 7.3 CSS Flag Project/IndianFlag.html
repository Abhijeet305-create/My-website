<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Indian_Flag</title>
        <style>
            .flag{
                width: 900px;
                height: 600px;
                position: relative;
            }
            .orange{
                background-color: orange;
                width: 900px;
                height: 200px;
                position: relative;
                
            }
            .white{
                background-color: white;
                width: 900px;
                height: 200px;
                position: absolute;
                top: 200px;

            }
            .green{
                background-color: green;
                width: 900px;
                height: 200px;
                position: absolute;
                top: 400px;
            }
            .flag.circle{
                background-color: blue;
                width: 200px;
                height: 200px;
                position: absolute;
                top: 200px;
                left: 350px;
                border-radius: 50%;
            }

        </style>
    </head>
    <body>
        <div class = "flag">
            <div class = "orange">
            </div>
            <div class = "circle">

            </div>
            <div class = "white">

            </div>
            <div class = "green">

            </div>
        </div>
        
    </body>
</html>
